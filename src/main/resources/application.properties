spring.application.name=seat-reserve-service-project
spring.threads.virtual.enabled=true

# --- datasource (values come from env vars; Railway reference syntax does NOT go here) ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:40}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true

# --- schema: Flyway owns it, Hibernate only validates ---
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true

# --- JSON: integer paise only ---
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false

# --- server ---
server.port=${PORT:8080}
server.tomcat.max-connections=20000
server.tomcat.accept-count=5000

# --- health, probes (/livez, /readyz), prometheus ---
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.metrics.tags.application=seating-booking-service

# --- logging: JSON with request_id/user_id/outcome from MDC ---
logging.structured.format.console=ecs
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# --- app (no insecure fallbacks: startup fails if these are not set) ---
booking.default-per-user-limit=4
booking.admin-key=${ADMIN_KEY}
booking.auth.secret=${AUTH_SECRET}
booking.auth.token-ttl=${AUTH_TOKEN_TTL:PT12H}
booking.auth.dev-issuer-enabled=${AUTH_DEV_ISSUER_ENABLED:false}
booking.metrics.gauge-refresh-ms=1000