spring.application.name=seat-reserve-service-project
spring.datasource.url=jdbc:mysql://localhost:3306/tarun_java
spring.threads.virtual.enabled=true

spring.datasource.username=root
spring.datasource.password=Ranjeet@2034
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:40}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true

# --- schema: Flyway owns it, Hibernate only validates ---
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true

# --- JSON: integer paise only ---
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false

# --- server ---
server.port=${PORT:8080}
server.tomcat.max-connections=20000
server.tomcat.accept-count=5000

# --- health, probes (/livez, /readyz), prometheus ---
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,database
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=always
management.metrics.tags.application=seating-booking-service

# --- logging: JSON with request_id/user_id/outcome from MDC ---
logging.structured.format.console=ecs
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# --- app ---
booking.default-per-user-limit=4
booking.admin-key=${ADMIN_KEY:dev-admin-key}
booking.auth.secret=${AUTH_SECRET:dev-only-secret-change-me-in-production-0123456789}
booking.auth.token-ttl=${AUTH_TOKEN_TTL:PT12H}
booking.auth.dev-issuer-enabled=${AUTH_DEV_ISSUER_ENABLED:true}
booking.metrics.gauge-refresh-ms=1000